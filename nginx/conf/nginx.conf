# microservices-lab 的 nginx 路由配置
# 作用：托管前端静态文件 + 把 /api 反代到网关（go-zero）。
# 启动：cd nginx && nginx.exe   （Windows 下 prefix 默认就是本目录）

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 前端静态文件（frontend 构建产物已拷到 nginx/html）
        location / {
            root   html;
            index  index.html;
            try_files $uri $uri/ /index.html;   # SPA 刷新不 404
        }

        # API 统一走网关（go-zero :8888）
        location /api/ {
            proxy_pass http://127.0.0.1:8888;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
