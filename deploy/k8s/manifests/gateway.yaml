apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: microservices-lab/gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            # 下游 user-svc 的地址，K8s 里走 Service DNS
            - name: USER_SVC_ADDR
              value: "http://user-svc:8000"
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8888
      targetPort: 8888
