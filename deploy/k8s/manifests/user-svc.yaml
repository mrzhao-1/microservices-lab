apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-svc
  labels:
    app: user-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-svc
  template:
    metadata:
      labels:
        app: user-svc
    spec:
      containers:
        - name: user-svc
          image: microservices-lab/user-svc:latest
          imagePullPolicy: IfNotPresent
          env:
            # 下游 notification-svc 的地址，K8s 里走 Service DNS
            - name: NOTIFY_SVC_ADDR
              value: "http://notification-svc:8081/notify"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: user-svc
spec:
  selector:
    app: user-svc
  ports:
    - port: 8000
      targetPort: 8000
