# microservices-lab 的 nginx 路由配置（K8s 版）
# 作用：托管前端静态文件 + 把 /api 反代到网关（go-zero）。
# 与 Windows 版（nginx/conf/nginx.conf）唯一的区别：反代地址从 127.0.0.1 改成 K8s Service 名 gateway。

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 前端静态文件（构建产物已拷到 /usr/share/nginx/html）
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;   # SPA 刷新不 404
        }

        # API 统一走网关（go-zero Service :8888）
        location /api/ {
            proxy_pass http://gateway:8888;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
